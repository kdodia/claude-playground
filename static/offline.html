<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Offline - The Lovely Commons</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
			background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 1rem;
		}

		.container {
			text-align: center;
			max-width: 400px;
		}

		.icon {
			font-size: 4rem;
			margin-bottom: 1.5rem;
		}

		h1 {
			color: #111827;
			font-size: 1.75rem;
			margin-bottom: 1rem;
		}

		p {
			color: #6b7280;
			line-height: 1.6;
			margin-bottom: 1.5rem;
		}

		.btn {
			display: inline-block;
			background-color: #10b981;
			color: white;
			padding: 0.875rem 1.5rem;
			border-radius: 0.5rem;
			text-decoration: none;
			font-weight: 600;
			transition: background-color 0.15s ease;
		}

		.btn:hover {
			background-color: #059669;
		}

		.hint {
			margin-top: 2rem;
			font-size: 0.875rem;
			color: #9ca3af;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="icon">📡</div>
		<h1>You're Offline</h1>
		<p>
			It looks like you've lost your internet connection.
			Don't worry - your data is safely stored locally and will sync when you're back online.
		</p>
		<button class="btn" onclick="window.location.reload()">
			Try Again
		</button>
		<p class="hint">
			Tip: You can still browse items you've previously viewed!
		</p>
	</div>
</body>
</html>
